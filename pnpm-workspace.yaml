packages:
  - pi-extensions/pi-codex-minimal-tools
  - pi-extensions/pi-codex-runtime
  - pi-extensions/pi-codex-core
  - pi-extensions/pi-codex-web-search
  - pi-extensions/pi-codex-imagegen
  - pi-extensions/pi-subagent
  - pi-extensions/pi-telegram-notify

# Keep exact published pins while resolving matching development packages locally.
linkWorkspacePackages: true
autoInstallPeers: false
lockfileIncludeTarballUrl: true

# Explicitly selected Pi release; all other release-age checks remain enabled.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.2.0'
  - '@earendil-works/pi-ai@1.2.0'
  - '@earendil-works/pi-codemode@1.2.0'
  - '@earendil-works/pi-coding-agent@1.2.0'
  - '@earendil-works/pi-mcp@1.2.0'
  - '@earendil-works/pi-telemetry@1.2.0'
  - '@earendil-works/pi-tui@1.2.0'
