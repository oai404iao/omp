name: Set up locked verification tooling
description: Install the repository-pinned pnpm graph without lifecycle scripts
inputs:
  node:
    description: Node.js version
    default: "24.x"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node }}
        cache: pnpm
    - shell: bash
      run: |
        printf 'PI_CODING_AGENT_DIR=%s/fixture-agent\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/fixture-agent"
        pnpm install --frozen-lockfile --ignore-scripts
