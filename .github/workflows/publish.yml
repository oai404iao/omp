name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" after reviewing the release PR and npm environment'
        required: true
        type: string
      package:
        description: "Optional exact workspace package name; blank publishes the full batch"
        required: false
        default: ""
        type: string
      recovery_run:
        description: "Optional original publish run ID; verify only, never upload npm packages"
        required: false
        default: ""
        type: string

# Publication is enabled only after trusted-publisher and environment review.
env:
  RELEASE_INFRASTRUCTURE_ENABLED: "true"
  RELEASE_PACKAGE: ${{ inputs.package }}

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out the release commit without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Select release verification scope
        run: node scripts/ci/plan.mjs --package "$RELEASE_PACKAGE" --output "$RUNNER_TEMP/release-plan.json"

      - name: Check exact-SHA trusted main coverage
        id: reuse
        run: node scripts/ci/trusted-main.mjs --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/ci-reuse.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify fresh repository policy
        run: node scripts/ci/run.mjs --plan "$RUNNER_TEMP/release-plan.json" --task policy --report "$RUNNER_TEMP/release-policy-timings.json"

      - name: Verify selected source packages when reuse is unavailable
        if: steps.reuse.outputs.reusable != 'true'
        run: node scripts/ci/run.mjs --plan "$RUNNER_TEMP/release-plan.json" --skip-policy --report "$RUNNER_TEMP/release-source-timings.json"

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Require a clean verified checkout
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Pack immutable release artifacts
        if: inputs.recovery_run == ''
        run: pnpm run release:artifacts

      - name: Verify the actual immutable release combination
        if: inputs.recovery_run == ''
        run: pnpm run release:verify-installations release-artifacts/manifest.json

      - name: Validate the original recovery run
        if: inputs.recovery_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const { RECOVERY_RUN: id, GITHUB_REPOSITORY: repo, GITHUB_SHA: sha } = process.env;
          assert.match(id, /^[1-9][0-9]*$/);
          assert.equal(repo, 'oai404iao/omp');
          const api = path => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const run = api(`repos/${repo}/actions/runs/${id}`);
          const workflow = api(`repos/${repo}/actions/workflows/publish.yml`);
          assert.equal(String(run.id), id);
          assert.equal(run.repository.full_name, repo);
          assert.equal(run.head_repository.full_name, repo);
          assert.equal(run.workflow_id, workflow.id);
          assert.equal(workflow.path, '.github/workflows/publish.yml');
          assert.equal(run.path, workflow.path);
          assert.equal(run.event, 'workflow_dispatch');
          assert.equal(run.head_branch, 'main');
          assert.equal(run.head_sha, sha);
          assert.equal(run.status, 'completed');
          NODE

      - name: Download original immutable artifacts for verify-only recovery
        if: inputs.recovery_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run }}

      - name: Revalidate reused source coverage before upload
        if: steps.reuse.outputs.reusable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/trusted-main.mjs --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ci-recheck.json"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; if (JSON.parse(readFileSync(process.argv[1], "utf8")).reusable !== true) throw new Error("Trusted CI proof changed; rerun verification");' "$RUNNER_TEMP/ci-recheck.json"

      - name: Bind verified artifacts to the uploaded manifest
        run: node scripts/release-consumer-receipt.mjs release-artifacts/manifest.json release-artifacts/consumer-verification.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/ci-reuse.json
            ${{ runner.temp }}/*timings.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Leave room for bounded registry read-after-write waits across a full batch.
    timeout-minutes: 330
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the verified release commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Enforce release safety gates
        run: node scripts/release-preflight.mjs
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirm }}

      - name: Pin trusted-publishing npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: .release-input

      - name: Publish exact tarballs and reconcile registry state
        env:
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_VERIFY_ONLY: ${{ inputs.recovery_run != '' && 'true' || 'false' }}
          NPM_REGISTRY_PROPAGATION_TIMEOUT_MS: "1800000"
          NPM_REGISTRY_PROPAGATION_INITIAL_DELAY_MS: "5000"
          NPM_REGISTRY_PROPAGATION_MAX_DELAY_MS: "30000"
        run: |
          node scripts/release-consumer-receipt.mjs .release-input/manifest.json .release-input/consumer-verification.json
          node scripts/publish-release-artifacts.mjs .release-input/manifest.json .release-input/result.json

      - name: Read registry reconciliation state
        id: reconciliation
        run: |
          node --input-type=module -e 'import { appendFileSync, readFileSync } from "node:fs"; const result = JSON.parse(readFileSync(".release-input/result.json", "utf8")); if (!["verified", "pending-visibility"].includes(result.state)) throw new Error("Registry reconciliation failed"); appendFileSync(process.env.GITHUB_OUTPUT, `state=${result.state}\n`);'

      - name: Push tags and create idempotent GitHub Releases
        if: steps.reconciliation.outputs.state == 'verified'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          node scripts/finalize-github-releases.mjs .release-input/result.json

      - name: Preserve publication receipts and immutable recovery artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-recovery-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .release-input/result.json
            .release-input/manifest.json
            .release-input/consumer-verification.json
            .release-input/*.tgz
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize registry reconciliation
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const path = '.release-input/result.json';
          const body = existsSync(path) ? readFileSync(path, 'utf8') : 'No publication result was written; inspect the failed safety gate.';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## npm publication receipt\n\nVerify-only recovery: ${process.env.VERIFY_ONLY}\n\n\`\`\`json\n${body}\n\`\`\`\n`);
          NODE
        env:
          VERIFY_ONLY: ${{ inputs.recovery_run != '' }}
