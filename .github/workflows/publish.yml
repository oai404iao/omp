name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" after reviewing the release PR and npm environment'
        required: true
        type: string
      package:
        description: "Optional exact workspace package name; blank publishes the full batch"
        required: false
        default: ""
        type: string

# Publication is enabled only after trusted-publisher and environment review.
env:
  RELEASE_INFRASTRUCTURE_ENABLED: "true"
  RELEASE_PACKAGE: ${{ inputs.package }}

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out the release commit without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify source packages
        run: pnpm run ci

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Require a clean verified checkout
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Pack immutable release artifacts
        run: pnpm run release:artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Leave room for bounded registry read-after-write waits across a full batch.
    timeout-minutes: 40
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out the verified release commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Enforce release safety gates
        run: node scripts/release-preflight.mjs
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirm }}

      - name: Pin trusted-publishing npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: .release-input

      - name: Publish exact tarballs and reconcile registry state
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_REGISTRY_PROPAGATION_TIMEOUT_MS: "180000"
          NPM_REGISTRY_PROPAGATION_INITIAL_DELAY_MS: "2000"
          NPM_REGISTRY_PROPAGATION_MAX_DELAY_MS: "15000"
        run: node scripts/publish-release-artifacts.mjs .release-input/manifest.json .release-input/result.json

      - name: Push tags and create idempotent GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          node scripts/finalize-github-releases.mjs .release-input/result.json
