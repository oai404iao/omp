name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.19.0"
          - "24.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run package checks
        run: npm run check

      - name: Test release-script safety checks
        run: npm run test:release-scripts

      - name: Verify license and source snapshots
        run: npm run license:check

      - name: Inspect npm tarballs
        run: npm run pack:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Ensure checks did not modify tracked files
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
