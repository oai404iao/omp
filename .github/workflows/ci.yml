name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.19.0"
          - "24.x"
        pi:
          - floor
          - target

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run complete baseline CI
        run: node scripts/test-pi-baselines.mjs ${{ matrix.pi }}
        env:
          OMP_PI_MATRIX_LOG_DIR: ${{ runner.temp }}/pi-matrix

      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-${{ matrix.pi }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/pi-matrix/
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Ensure checks did not modify tracked files
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
